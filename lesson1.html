<html lang="bn">
<head>
<meta charset="utf-8">

<title>পৃথিবীর অভ্যন্তরীণ গঠন – মিশন আর্থ কোর</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#2a2118;--mut:#6b5d4f;--bd:#e8dccb;--pri:#d9480f;--ok:#2b8a3e;--bad:#c92a2a;--c1:#8d6e4a;--c2:#e8590c;--c3:#f59f00;--c4:#fff3bf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#272019;--tx:#f5ece0;--mut:#b9a994;--bd:#3d3326;--c4:#ffe066}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#272019;--tx:#f5ece0;--mut:#b9a994;--bd:#3d3326;--c4:#ffe066}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali','Kalpurush','Nirmala UI',system-ui,sans-serif;line-height:1.7}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:.2rem 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.xp{background:var(--card);border:2px solid var(--pri);border-radius:99px;padding:2px 14px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{flex:1;min-width:92px;font:inherit;font-weight:600;padding:8px 6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
svg{width:100%;max-width:320px;display:block;margin:0 auto}
.ly{cursor:pointer;transition:.2s}.ly:hover{opacity:.8}.ly.act{stroke:var(--tx);stroke-width:3}
.ghost{fill:none;stroke:var(--bd);stroke-dasharray:4 4}
.btn{font:inherit;font-weight:600;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;margin:4px 4px 0 0;cursor:pointer}
.btn:hover{border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.main{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;background:var(--c4);color:#3a2e00;border-radius:8px;padding:0 8px;margin:2px;font-weight:600}
.part{border-left:5px solid var(--pri);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:6px}
.mut{color:var(--mut)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:.3s}
.big{font-size:1.15rem;font-weight:700}
.ctr{text-align:center}
</style>
</head>

<div class="w">
<div class="top"><h1>🌍 মিশন আর্থ কোর</h1><div class="xp">⭐ স্কোর: <span id="xp">0</span></div></div>

</div>
<div id="v"></div>
</div>

 '<div>'+d.f.map(function(x){return '<span class="tag">'+x+'</span>'}).join('')+'</div>'+
 d.p.map(function(p){return '<div class="part"><b>'+p[0]+'</b> – '+p[1]+'<br>'+p[2]+'</div>'}).join('');}
