<html lang="bn">
<head>

<title>শিলা গোয়েন্দা – পাথরের গল্প</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf3;--card:#fff;--tx:#2a2118;--mut:#6b5d4f;--bd:#e8dccb;--pri:#d9480f;--ok:#2b8a3e;--bad:#c92a2a;--c4:#fff3bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#272019;--tx:#f5ece0;--mut:#b9a994;--bd:#3d3326}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#272019;--tx:#f5ece0;--mut:#b9a994;--bd:#3d3326}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali','Kalpurush','Nirmala UI',system-ui,sans-serif;line-height:1.7}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:.2rem 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.xp{background:var(--card);border:2px solid var(--pri);border-radius:99px;padding:2px 14px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{flex:1;min-width:104px;font:inherit;font-weight:600;padding:8px 6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
.ly{cursor:pointer;transition:.2s}.ly:hover{opacity:.75}.ly.act{stroke:#fff;stroke-width:3}
.btn{font:inherit;font-weight:600;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;margin:4px 4px 0 0;cursor:pointer}
.btn:hover{border-color:var(--pri)}.btn.on{border-color:var(--pri);background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.main{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;background:var(--c4);color:#3a2e00;border-radius:8px;padding:0 8px;margin:2px;font-weight:600}
.part{border-left:5px solid var(--pri);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:6px}
.mut{color:var(--mut)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:.3s}
.big{font-size:1.15rem;font-weight:700}.ctr{text-align:center}
</style>
</head>

function bn(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
/* generic multiple-choice game */
function mc(el,arr,n){var a=shuf(arr).slice(0,n),i=0,s=0;
 (function go(){
  if(i>=a.length){el.innerHTML='<div class="ctr"><p class="big">🎉 '+bn(s)+'/'+bn(a.length)+' সঠিক</p><p>'+(s==a.length?'পুরো নম্বর! তুমি সত্যিকারের শিলা-গোয়েন্দা 🏆':s>=a.length*.6?'দারুণ! আরেকবার খেললে পুরো নম্বর পাবে 💪':'উপরের কার্ড দেখে আবার খেলো 📖')+'</p><button class="btn main">আবার খেলি 🔁</button></div>';
   el.querySelector('button').onclick=function(){mc(el,arr,n)};return}
  var q=a[i];
  el.innerHTML='<div class="bar"><i style="width:'+(i/a.length*100)+'%"></i></div><p class="mut">প্রশ্ন '+bn(i+1)+'/'+bn(a.length)+'</p><p class="big">'+q[0]+'</p>'+q[1].map(function(o,k){return '<button class="btn" data-i="'+k+'" style="display:block;width:100%;text-align:left">'+o+'</button>'}).join('')+'<p class="m"></p>';
  var bs=el.querySelectorAll('[data-i]');
  bs.forEach(function(b){b.onclick=function(){
   bs.forEach(function(x){x.disabled=true});var m=el.querySelector('.m');
   if(+b.dataset.i==q[2]){b.classList.add('ok');m.textContent='✅ সঠিক! +১০';add(10);s++}
   else{b.classList.add('no');bs[q[2]].classList.add('ok');m.textContent='❌ সঠিক উত্তর সবুজে দেখো';add(-2)}

 })()}
